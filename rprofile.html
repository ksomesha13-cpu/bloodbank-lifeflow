<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bloodbank | Receiver Profile</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="css/style.css" rel="stylesheet"/>
    <link rel="shortcut icon" type="image/jpeg" href="image/favicon.jpg">
</head>
<body>
    <!-- Navigation Bar -->
    <nav id="mainNav" class="navbar navbar-expand-sm navbar-light bg-light sticky-top"></nav>

    <div class="container cont">
        <!-- Message Container -->
        <div id="message-container"></div>

        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6 col-sm-8 mb-5">
                <div class="card shadow-sm">
                    <div class="text-center pt-4">
                        <img src="image/user.png" alt="Receiver Profile Picture" class="rounded-circle shadow-sm" width="80" height="80">
                        <h4 class="mt-2 font-weight-bold" id="profileHeading">Receiver Profile</h4>
                    </div>
                    <div class="card-body px-4">
                        <form id="rprofileForm">
                            <label class="text-muted font-weight-bold">Receiver Name</label>
                            <input type="text" id="profRname" class="form-control mb-3" required>

                            <label class="text-muted font-weight-bold">Receiver Email</label>
                            <input type="email" id="profRemail" class="form-control mb-3" required>

                            <label class="text-muted font-weight-bold">Receiver Password</label>
                            <input type="text" id="profRpassword" class="form-control mb-3" required>

                            <label class="text-muted font-weight-bold">Receiver Phone Number</label>
                            <input type="text" id="profRphone" class="form-control mb-3" required>

                            <label class="text-muted font-weight-bold">Receiver City</label>
                            <input type="text" id="profRcity" class="form-control mb-3" required>

                            <label class="text-muted font-weight-bold">Receiver Blood Group</label>
                            <select id="profRbg" class="form-control mb-4" required>
                                <option value="A-">A-</option>
                                <option value="A+">A+</option>
                                <option value="B-">B-</option>
                                <option value="B+">B+</option>
                                <option value="AB-">AB-</option>
                                <option value="AB+">AB+</option>
                                <option value="O-">O-</option>
                                <option value="O+">O+</option>
                            </select>

                            <button type="submit" class="btn btn-block btn-primary mb-3">Update Profile</button>
                        </form>
                    </div>
                    <div class="text-center pb-4">
                        <a href="index.html" class="text-secondary font-weight-bold">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer text-center bg-light">
        © Copyright <span id="yearSpan"></span> <span class="brand">Blood Bank. </span> All Rights Reserved.
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="js/security.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Guard: Receiver access only
        const session = BloodBank.getSession();
        if (!session || session.type !== 'receiver') {
            alert('Please login as a Receiver to access this page.');
            window.location.href = 'login.html';
        }

        BloodBank.initNavbar('rprofile');
        BloodBank.initMessages();
        BloodBank.initFooter();

        function loadProfile() {
            const db = BloodBank.getDB();
            const receiver = db.receivers.find(r => r.id === session.id);
            if (!receiver) {
                alert('Receiver profile not found.');
                BloodBank.logout();
                return;
            }

            document.getElementById('profileHeading').textContent = receiver.rname;
            document.getElementById('profRname').value = receiver.rname || '';
            document.getElementById('profRemail').value = receiver.remail || '';
            document.getElementById('profRpassword').value = receiver.rpassword || '';
            document.getElementById('profRphone').value = receiver.rphone || '';
            document.getElementById('profRcity').value = receiver.rcity || '';
            document.getElementById('profRbg').value = receiver.rbg || 'A+';
        }

        document.getElementById('rprofileForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const rname = document.getElementById('profRname').value.trim();
            const remail = document.getElementById('profRemail').value.trim();
            const rpassword = document.getElementById('profRpassword').value;
            const rphone = document.getElementById('profRphone').value.trim();
            const rcity = document.getElementById('profRcity').value.trim();
            const rbg = document.getElementById('profRbg').value;

            const db = BloodBank.getDB();
            const receiver = db.receivers.find(r => r.id === session.id);
            if (receiver) {
                receiver.rname = rname;
                receiver.remail = remail;
                receiver.rpassword = rpassword;
                receiver.rphone = rphone;
                receiver.rcity = rcity;
                receiver.rbg = rbg;
                BloodBank.saveDB(db);

                // Update active session name
                session.name = rname;
                session.email = remail;
                BloodBank.setSession(session);

                BloodBank.showBanner("Your profile is updated successfully.");
                BloodBank.initNavbar('rprofile');
                document.getElementById('profileHeading').textContent = rname;
            }
        });

        loadProfile();
    </script>
</body>
</html>
