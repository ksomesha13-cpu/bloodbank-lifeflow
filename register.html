<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- SEO Meta Tags -->
    <title>Register as a Blood Donor or Partner Hospital | LifeFlow</title>
    <meta name="description" content="Join the LifeFlow network. Register as a voluntary blood donor, enroll as a partner hospital, or register as a recipient for emergency blood matching." />
    <meta name="keywords" content="register blood donor, donate blood, volunteer blood donation, hospital blood bank enrollment, recipient registration, save lives" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://localhost:8443/register.html" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="css/style.css" rel="stylesheet"/>
    <link rel="shortcut icon" type="image/jpeg" href="image/favicon.jpg">
</head>
<body>
    <!-- Navigation Bar -->
    <nav id="mainNav" class="navbar navbar-expand-sm navbar-light bg-light sticky-top"></nav>

    <div class="container cont">
        <!-- Message Container -->
        <div id="message-container"></div>

        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6 col-sm-8 mb-5">
                <div class="card rounded">
                    <ul class="nav nav-tabs justify-content-center bg-light" style="padding: 15px 10px 0 10px;">
                        <li class="nav-item">
                            <a class="nav-link active font-weight-bold" data-toggle="tab" href="#hospitals">Hospital</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link font-weight-bold" data-toggle="tab" href="#receivers">Recipient</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link font-weight-bold text-danger" data-toggle="tab" href="#donors">
                                <i class="fas fa-hand-holding-heart mr-1"></i> Voluntary Donor
                            </a>
                        </li>
                    </ul>

                    <div class="tab-content p-4">
                        <!-- Hospital Registration Pane -->
                        <div class="tab-pane container active" id="hospitals">
                            <form id="hospitalRegForm">
                                <label class="text-muted font-weight-bold">Hospital Name</label>
                                <input type="text" id="regHname" placeholder="Hospital Name" class="form-control mb-3" required>
                                
                                <label class="text-muted font-weight-bold">Hospital City</label>
                                <input type="text" id="regHcity" placeholder="Hospital City" class="form-control mb-3" required>
                                
                                <label class="text-muted font-weight-bold">Hospital Phone Number</label>
                                <input type="tel" id="regHphone" placeholder="Hospital Phone Number (10 digits)" class="form-control mb-3" required pattern="[0,6-9]{1}[0-9]{9,11}" title="Phone must start with 0, 6, 7, 8, or 9 and have 10 to 12 digits">
                                
                                <label class="text-muted font-weight-bold">Hospital Email</label>
                                <input type="email" id="regHemail" placeholder="Hospital Email" class="form-control mb-3" required>
                                
                                <label class="text-muted font-weight-bold">Hospital Password</label>
                                <input type="password" id="regHpassword" placeholder="Hospital Password (min 6 characters)" class="form-control mb-4" required minlength="6">
                                
                                <button type="submit" class="btn btn-primary btn-block mb-3">Register Hospital</button>
                            </form>
                        </div>

                        <!-- Receiver Registration Pane -->
                        <div class="tab-pane container fade" id="receivers">
                            <form id="receiverRegForm">
                                <label class="text-muted font-weight-bold">Receiver Name</label>
                                <input type="text" id="regRname" placeholder="Receiver Name" class="form-control mb-3" required>
                                
                                <label class="text-muted font-weight-bold">Blood Group</label>
                                <select id="regRbg" class="form-control mb-3" required>
                                    <option value="" disabled selected>Select Blood Group</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                                
                                <label class="text-muted font-weight-bold">Receiver City</label>
                                <input type="text" id="regRcity" placeholder="Receiver City" class="form-control mb-3" required>
                                
                                <label class="text-muted font-weight-bold">Receiver Phone Number</label>
                                <input type="tel" id="regRphone" placeholder="Receiver Phone Number (10 digits)" class="form-control mb-3" required pattern="[0,6-9]{1}[0-9]{9,11}" title="Phone must start with 0, 6, 7, 8, or 9 and have 10 to 12 digits">
                                
                                <label class="text-muted font-weight-bold">Receiver Email</label>
                                <input type="email" id="regRemail" placeholder="Receiver Email" class="form-control mb-3" required>
                                
                                <label class="text-muted font-weight-bold">Receiver Password</label>
                                <input type="password" id="regRpassword" placeholder="Receiver Password (min 6 characters)" class="form-control mb-4" required minlength="6">
                                
                                <button type="submit" class="btn btn-primary btn-block mb-3">Register Receiver</button>
                            </form>
                        </div>

                        <!-- Donor Registration Pane -->
                        <div class="tab-pane container fade" id="donors">
                            <form id="donorRegForm">
                                <label class="text-muted font-weight-bold">Donor Full Name</label>
                                <input type="text" id="regDname" placeholder="Your Full Name" class="form-control mb-3" required>

                                <label class="text-muted font-weight-bold">Blood Group</label>
                                <select id="regDbg" class="form-control mb-3" required>
                                    <option value="" disabled selected>Select Your Blood Group</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>

                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label class="text-muted font-weight-bold">Age</label>
                                        <input type="number" id="regDage" placeholder="Age" min="18" max="65" class="form-control mb-3" required value="24">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label class="text-muted font-weight-bold">Gender</label>
                                        <select id="regDgender" class="form-control mb-3">
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>

                                <label class="text-muted font-weight-bold">City</label>
                                <input type="text" id="regDcity" placeholder="e.g. Delhi, Mumbai" class="form-control mb-3" required>

                                <label class="text-muted font-weight-bold">Contact Phone Number</label>
                                <input type="tel" id="regDphone" placeholder="Phone Number" class="form-control mb-3" required>

                                <label class="text-muted font-weight-bold">Email Address</label>
                                <input type="email" id="regDemail" placeholder="Email Address" class="form-control mb-4" required>

                                <button type="submit" class="btn btn-danger btn-block mb-3 font-weight-bold">
                                    <i class="fas fa-heart mr-1"></i> Register as Voluntary Donor
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="text-center pb-4">
                        <a href="login.html" class="text-info font-weight-bold" title="Click here to login">Already have an account? Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer text-center bg-light">
        © Copyright <span id="yearSpan"></span> <span class="brand">Blood Bank. </span> All Rights Reserved.
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="js/security.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check if already logged in
        const currentSession = BloodBank.getSession();
        if (currentSession) {
            if (currentSession.type === 'hospital') {
                window.location.href = 'bloodrequest.html';
            } else if (currentSession.type === 'receiver') {
                window.location.href = 'sentrequest.html';
            }
        }

        BloodBank.initNavbar('register');
        BloodBank.initMessages();
        BloodBank.initFooter();

        // Hospital Registration
        document.getElementById('hospitalRegForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const hname = document.getElementById('regHname').value.trim();
            const hcity = document.getElementById('regHcity').value.trim();
            const hphone = document.getElementById('regHphone').value.trim();
            const hemail = document.getElementById('regHemail').value.trim().toLowerCase();
            const hpassword = document.getElementById('regHpassword').value;

            const db = BloodBank.getDB();
            if (db.hospitals.some(h => h.hemail.toLowerCase() === hemail)) {
                BloodBank.showBanner("Hospital with this email already exists.", true);
                return;
            }

            const newId = db.hospitals.length > 0 ? Math.max(...db.hospitals.map(h => h.id)) + 1 : 1;
            const newHospital = { id: newId, hname, hemail, hpassword, hphone, hcity };
            db.hospitals.push(newHospital);
            BloodBank.saveDB(db);

            // Log in as new hospital
            BloodBank.setSession({
                type: 'hospital',
                id: newId,
                name: hname,
                email: hemail
            });

            window.location.href = 'bloodrequest.html?msg=' + encodeURIComponent('You have registered and logged in successfully.');
        });

        // Receiver Registration
        document.getElementById('receiverRegForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const rname = document.getElementById('regRname').value.trim();
            const rbg = document.getElementById('regRbg').value;
            const rcity = document.getElementById('regRcity').value.trim();
            const rphone = document.getElementById('regRphone').value.trim();
            const remail = document.getElementById('regRemail').value.trim().toLowerCase();
            const rpassword = document.getElementById('regRpassword').value;

            if (!rbg) {
                BloodBank.showBanner("Please select your blood group.", true);
                return;
            }

            const db = BloodBank.getDB();
            if (db.receivers.some(r => r.remail.toLowerCase() === remail)) {
                BloodBank.showBanner("Receiver with this email already exists.", true);
                return;
            }

            const newId = db.receivers.length > 0 ? Math.max(...db.receivers.map(r => r.id)) + 1 : 1;
            const newReceiver = { id: newId, rname, remail, rpassword, rphone, rbg, rcity };
            db.receivers.push(newReceiver);
            BloodBank.saveDB(db);

            // Log in as new receiver
            BloodBank.setSession({
                type: 'receiver',
                id: newId,
                name: rname,
                email: remail
            });

            window.location.href = 'sentrequest.html?msg=' + encodeURIComponent('You have registered and logged in successfully.');
        });

        // Donor Registration Handler
        document.getElementById('donorRegForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const dname = document.getElementById('regDname').value.trim();
            const dbg = document.getElementById('regDbg').value;
            const dage = parseInt(document.getElementById('regDage').value) || 24;
            const dgender = document.getElementById('regDgender').value;
            const dcity = document.getElementById('regDcity').value.trim();
            const dphone = document.getElementById('regDphone').value.trim();
            const demail = document.getElementById('regDemail').value.trim().toLowerCase();

            const db = BloodBank.getDB();
            if (!db.donors) db.donors = [];

            const newId = db.donors.length > 0 ? Math.max(...db.donors.map(d => d.id)) + 1 : 1;
            db.donors.push({
                id: newId,
                dname,
                dbg,
                dage,
                dgender,
                dcity,
                dphone,
                demail,
                lastDonation: new Date().toISOString().slice(0, 10),
                status: 'Eligible',
                unitsDonated: 1
            });

            BloodBank.saveDB(db);
            window.location.href = 'index.html?msg=' + encodeURIComponent('Thank you, ' + dname + '! You have been registered as a verified voluntary donor.');
        });
    </script>
</body>
</html>
